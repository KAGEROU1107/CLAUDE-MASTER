name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only: PRs from forks get no secrets and cannot write to the repo.
permissions:
  contents: read

jobs:
  matrix-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs; the trailing comment is the release tag on that commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python version
        run: python --version
      - name: Unit tests (isolated mode)
        run: python -I -B -m unittest discover -s tests -v
      - name: Shell syntax (POSIX)
        if: runner.os != 'Windows'
        run: bash -n kit/bootstrap.sh
      - name: Release leak scan
        run: python -I -B kit/tools/release_scan.py .

  # Stable single check name for branch protection; fails unless every matrix leg succeeded.
  test:
    if: always()
    needs: [matrix-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all matrix legs to succeed
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ]; then
            echo "matrix-test result: ${{ needs.matrix-test.result }}" >&2
            exit 1
          fi
